<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Your Order | A’s Accessories</title><link rel="stylesheet" href="styles.css"><script defer src="app.js"></script></head>
<body><div id="site-header"></div><main class="container"><section class="lookup"><div class="eyebrow">Order updates</div><h1 class="section-title">Track your order</h1><p class="lead">Enter the reference from your checkout and the email address used to place the order.</p><form class="form-section" id="order-lookup"><div class="form-field"><label for="lookup-reference">Order reference *</label><input class="input" id="lookup-reference" name="reference" required></div><div class="form-field" style="margin-top:12px"><label for="lookup-email">Checkout email *</label><input class="input" id="lookup-email" name="email" type="email" required></div><button class="btn" style="margin-top:18px" type="submit">Find my order</button></form><div id="lookup-result"></div></section></main><div id="site-footer"></div></body></html>
